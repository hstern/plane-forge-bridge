name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # build-image + publish push to ghcr; declared at workflow level so both
  # jobs inherit. lint + e2e jobs only read and don't need this.
  packages: write

jobs:
  # Multi-stage Docker build. The Dockerfile's `test` stage runs
  # `go vet`, `go test -race`, and `govulncheck` against the source the
  # runtime binary is built from. If tests fail there, the image is never
  # pushed, so e2e-docker / publish (which consume this image) never run.
  # The "publish what we tested" property is enforced by the build pipeline
  # itself, not by job-level dependencies.
  build-image:
    name: build-image
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    outputs:
      image: ${{ steps.refs.outputs.image }}
      stub_image: ${{ steps.refs.outputs.stub_image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image refs
        id: refs
        run: |
          # Docker refs must be lowercase; GH allows mixed-case repo names.
          owner_repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner_repo}:ci-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          echo "stub_image=ghcr.io/${owner_repo}/plane-stub:ci-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      # Test stage runs on the build platform (single arch) so go test -race
      # runs natively, not under qemu. Cache shared with the runtime build
      # below so the source-layer build is reused.
      - name: Test (Dockerfile `test` stage)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build + push multi-arch runtime
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.refs.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # plane-stub is the recording stub used by the e2e job. Build it once
      # here so the e2e matrix legs share the same artifact, and so the
      # registry-served image works under `services:` blocks if we ever
      # promote the stub to a service container.
      - name: Build + push plane-stub image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: test/e2e-docker/plane-stub/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.refs.outputs.stub_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lint:
    name: lint
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.1

  # End-to-end. Brings up a forge service container (Forgejo or Gitea —
  # matrixed because they share the v1 webhook contract), runs the bridge
  # and plane-stub as sibling containers attached to the forge service's
  # auto-generated network so the forge can POST webhooks to the bridge by
  # container name. Seeds a repo + webhook, creates an issue via REST, and
  # asserts the bridge translated it into a recorded POST against
  # plane-stub with the loop-break marker present.
  e2e-docker:
    name: e2e-docker (${{ matrix.forge.name }})
    needs: build-image
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        forge:
          - name: forgejo
            image: codeberg.org/forgejo/forgejo:15
            flavor: forgejo
          - name: gitea
            image: gitea/gitea:1.22
            flavor: gitea
    services:
      forge:
        image: ${{ matrix.forge.image }}
        ports:
          - 3000:3000
        env:
          # Skip the install wizard so the container starts ready.
          FORGEJO__security__INSTALL_LOCK: "true"
          FORGEJO__server__ROOT_URL: "http://localhost:3000/"
          FORGEJO__server__HTTP_PORT: "3000"
          FORGEJO__server__DOMAIN: "localhost"
          # Webhooks default to refusing delivery to private/unknown hosts.
          # In CI the bridge is reachable only as the container name `bridge`
          # on the docker network, so we open the allowlist. Not appropriate
          # for production.
          FORGEJO__webhook__ALLOWED_HOST_LIST: "*"
          GITEA__security__INSTALL_LOCK: "true"
          GITEA__server__ROOT_URL: "http://localhost:3000/"
          GITEA__server__HTTP_PORT: "3000"
          GITEA__server__DOMAIN: "localhost"
          GITEA__webhook__ALLOWED_HOST_LIST: "*"
    env:
      FORGE_URL: http://localhost:3000
      FORGE_ADMIN_USER: pfbadmin
      FORGE_ADMIN_PASS: pfb-CI-Pass-1!
      FORGE_ADMIN_EMAIL: pfbadmin@example.com
      FORGE_ORG: pfborg
      FORGE_REPO: pfbrepo
      PFB_FORGE_WEBHOOK_SECRET: ci-forge-secret-${{ github.run_id }}
      PFB_PLANE_API_KEY: ci-plane-key-${{ github.run_id }}
      PFB_PLANE_WEBHOOK_SECRET: ci-plane-secret-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Identify forge service container
        id: forge
        # The forge runs as a GitHub Actions `services:` container; the
        # bridge and plane-stub need to join its auto-generated network so
        # the forge can address the bridge by container name when posting
        # webhooks.
        run: |
          set -euo pipefail
          cid=$(docker ps --filter "ancestor=${{ matrix.forge.image }}" -q | head -n1)
          if [ -z "$cid" ]; then
            echo "ERROR: forge service container not found"
            docker ps -a
            exit 1
          fi
          cname=$(docker inspect -f '{{.Name}}' "$cid" | sed 's|^/||')
          net=$(docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' "$cid" | tr ' ' '\n' | grep -vE '^(bridge|host|none|)$' | head -n1)
          if [ -z "$net" ]; then net=bridge; fi
          # Use the container's IP directly for the bridge's forge URL —
          # docker DNS over the auto-generated container name has been flaky
          # under load (one Forgejo leg hit "no such host"); the IP is
          # stable for the duration of the job. Matches fj-bellows' pattern.
          ip=$(docker inspect -f "{{(index .NetworkSettings.Networks \"$net\").IPAddress}}" "$cid")
          echo "forge container=$cname network=$net ip=$ip"
          echo "name=$cname"   >> "$GITHUB_OUTPUT"
          echo "network=$net" >> "$GITHUB_OUTPUT"
          echo "ip=$ip"       >> "$GITHUB_OUTPUT"

      - name: Start plane-stub on the forge network
        run: |
          set -euo pipefail
          docker pull '${{ needs.build-image.outputs.stub_image }}'
          docker run -d --name plane-stub --network '${{ steps.forge.outputs.network }}' \
            -p 8081:8080 '${{ needs.build-image.outputs.stub_image }}'
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8081/_/healthz >/dev/null 2>&1; then
              echo "plane-stub healthy after ${i}s"; break
            fi
            sleep 1
          done
          curl -fsS http://localhost:8081/_/healthz

      - name: Write bridge config
        env:
          # Address forge by IP rather than container DNS name — docker DNS
          # over the auto-generated underscored hostnames has been flaky.
          FORGE_INTERNAL_HOST: ${{ steps.forge.outputs.ip }}
        run: |
          set -euo pipefail
          # The bridge config uses container names (resolved on the docker
          # network) for both the forge URL (outbound, when step 10 lands)
          # and the plane URL. The bridge listens on 0.0.0.0 inside its
          # container so the forge can reach it as http://bridge:8080.
          # The plane_project_id is a synthetic UUID — plane-stub doesn't
          # care, the asserter only checks the URL shape + body fields.
          cat > config.yaml <<YAML
          listen: "0.0.0.0:8080"
          log_level: debug
          forge:
            base_url: http://${FORGE_INTERNAL_HOST}:3000
            token_env: PFB_FORGE_TOKEN
            webhook_secret_env: PFB_FORGE_WEBHOOK_SECRET
          plane:
            base_url: http://plane-stub:8080/api/v1
            workspace_slug: ci
            api_key_env: PFB_PLANE_API_KEY
            webhook_secret_env: PFB_PLANE_WEBHOOK_SECRET
          bridge_bot:
            forge_username: pfb-bot
            plane_member_id: 00000000-0000-0000-0000-000000000000
          links:
            - forge_repo: ${FORGE_ORG}/${FORGE_REPO}
              plane_project_id: aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa
              project_identifier: PFB
              state_map: {}
              pr_state_map:
                opened: "In Progress"
                merged: "Done"
                closed: "Cancelled"
          users: {}
          YAML

      - name: Pull bridge image (with retry against ghcr transient denies)
        run: |
          set -euo pipefail
          image='${{ needs.build-image.outputs.image }}'
          # ghcr.io intermittently returns "denied: denied" on freshly-pushed
          # multi-arch manifests for a few seconds after the push. Re-login
          # and retry up to 6 times with backoff before giving up.
          for i in 1 2 3 4 5 6; do
            if docker pull "$image"; then
              echo "pulled after $i attempt(s)"; exit 0
            fi
            echo "pull failed; re-authenticating and retrying in $((i*5))s"
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            sleep $((i*5))
          done
          echo "ERROR: docker pull never succeeded"
          exit 1

      - name: Launch bridge on the forge network
        run: |
          set -euo pipefail
          # We set PFB_FORGE_TOKEN after Forgejo is seeded (next step) and
          # pass it via env. Mock it for now so the config loader's
          # ErrSecretMissing check passes; the real value flows in from the
          # seed step.
          docker run -d --name bridge \
            --network '${{ steps.forge.outputs.network }}' \
            -p 8080:8080 \
            -v "$PWD/config.yaml:/etc/pfb/config.yaml:ro" \
            -e PFB_FORGE_TOKEN=placeholder-set-after-seed \
            -e PFB_FORGE_WEBHOOK_SECRET="$PFB_FORGE_WEBHOOK_SECRET" \
            -e PFB_PLANE_API_KEY="$PFB_PLANE_API_KEY" \
            -e PFB_PLANE_WEBHOOK_SECRET="$PFB_PLANE_WEBHOOK_SECRET" \
            '${{ needs.build-image.outputs.image }}' \
            --config /etc/pfb/config.yaml
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              echo "bridge healthy after ${i}s"; break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz

      - name: Smoke — webhook 202 on valid signature (direct POST)
        env:
          FORGE_SECRET: ${{ env.PFB_FORGE_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          body=$(cat internal/forge/testdata/issues_opened.json)
          sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$FORGE_SECRET" -hex | awk '{print $NF}')
          status=$(curl -sS -o /tmp/resp -w '%{http_code}' \
            -X POST http://127.0.0.1:8080/forge/webhook \
            -H "X-Gitea-Signature: $sig" \
            -H "X-Gitea-Event: issues" \
            -H "X-Gitea-Delivery: ci-${{ github.run_id }}-direct-valid" \
            -H 'Content-Type: application/json' \
            --data-binary "$body")
          echo "status=$status body=$(cat /tmp/resp)"
          [ "$status" = "202" ] || { echo "ERROR: expected 202, got $status"; exit 1; }

      - name: Smoke — webhook 401 on invalid signature (direct POST)
        run: |
          set -euo pipefail
          body=$(cat internal/forge/testdata/issues_opened.json)
          status=$(curl -sS -o /tmp/resp -w '%{http_code}' \
            -X POST http://127.0.0.1:8080/forge/webhook \
            -H 'X-Gitea-Signature: deadbeef' \
            -H 'X-Gitea-Event: issues' \
            -H "X-Gitea-Delivery: ci-${{ github.run_id }}-direct-invalid" \
            -H 'Content-Type: application/json' \
            --data-binary "$body")
          [ "$status" = "401" ] || { echo "ERROR: expected 401, got $status"; exit 1; }

      - name: Seed forge with org + repo + webhook
        id: seed
        env:
          FORGE_CONTAINER: ${{ steps.forge.outputs.name }}
          FORGE_FLAVOR: ${{ matrix.forge.flavor }}
          BRIDGE_WEBHOOK_URL: http://bridge:8080/forge/webhook
        run: |
          set -euo pipefail
          chmod +x test/e2e-docker/seed.sh
          token=$(bash test/e2e-docker/seed.sh)
          echo "::add-mask::$token"
          # Reload the bridge with the real forge token so future outbound
          # forge calls (step 10+) will be authorized. Step 6 only does
          # forge→plane so the token is currently unused by the bridge,
          # but plumbing it in now keeps the integration path warm.
          docker rm -f bridge >/dev/null
          docker run -d --name bridge \
            --network '${{ steps.forge.outputs.network }}' \
            -p 8080:8080 \
            -v "$PWD/config.yaml:/etc/pfb/config.yaml:ro" \
            -e PFB_FORGE_TOKEN="$token" \
            -e PFB_FORGE_WEBHOOK_SECRET="$PFB_FORGE_WEBHOOK_SECRET" \
            -e PFB_PLANE_API_KEY="$PFB_PLANE_API_KEY" \
            -e PFB_PLANE_WEBHOOK_SECRET="$PFB_PLANE_WEBHOOK_SECRET" \
            '${{ needs.build-image.outputs.image }}' \
            --config /etc/pfb/config.yaml
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              echo "bridge healthy after ${i}s"; break
            fi
            sleep 1
          done
          echo "FORGE_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Create a forge label for the e2e issue
        id: label
        run: |
          set -euo pipefail
          http_code=$(curl -sS -o /tmp/label.json -w '%{http_code}' \
            -H "Authorization: token $FORGE_TOKEN" \
            -H 'Content-Type: application/json' \
            -X POST \
            -d '{"name":"e2e-bug","color":"#ff0000","description":"created by CI to exercise label propagation"}' \
            "$FORGE_URL/api/v1/repos/$FORGE_ORG/$FORGE_REPO/labels")
          echo "POST /labels status=$http_code"
          cat /tmp/label.json | head -c 1000; echo
          [ "$http_code" = "201" ] || { echo "ERROR: label create returned $http_code"; exit 1; }
          label_id=$(jq -r .id /tmp/label.json)
          echo "id=$label_id" >> "$GITHUB_OUTPUT"

      - name: Create an issue via forge REST API
        id: issue
        run: |
          set -euo pipefail
          # Don't use -f so we get the response body on non-2xx for diagnosis.
          http_code=$(curl -sS -o /tmp/issue.json -w '%{http_code}' \
            -H "Authorization: token $FORGE_TOKEN" \
            -H 'Content-Type: application/json' \
            -X POST \
            -d "{\"title\":\"e2e: hello from CI\",\"body\":\"This issue triggers the forge→plane translator.\",\"labels\":[${{ steps.label.outputs.id }}]}" \
            "$FORGE_URL/api/v1/repos/$FORGE_ORG/$FORGE_REPO/issues")
          echo "POST /issues status=$http_code"
          cat /tmp/issue.json | head -c 2000; echo
          if [ "$http_code" != "201" ]; then
            echo "ERROR: issue creation returned $http_code"
            exit 1
          fi
          issue_id=$(jq -r .id /tmp/issue.json)
          issue_number=$(jq -r .number /tmp/issue.json)
          echo "created issue id=$issue_id number=$issue_number"
          if [ -z "$issue_id" ] || [ "$issue_id" = "null" ]; then
            echo "ERROR: issue creation returned no id"
            exit 1
          fi
          echo "id=$issue_id"         >> "$GITHUB_OUTPUT"
          echo "number=$issue_number" >> "$GITHUB_OUTPUT"

      - name: Post a comment on the issue via forge REST API
        run: |
          set -euo pipefail
          http_code=$(curl -sS -o /tmp/comment.json -w '%{http_code}' \
            -H "Authorization: token $FORGE_TOKEN" \
            -H 'Content-Type: application/json' \
            -X POST \
            -d '{"body":"e2e: comment from CI"}' \
            "$FORGE_URL/api/v1/repos/$FORGE_ORG/$FORGE_REPO/issues/${{ steps.issue.outputs.number }}/comments")
          echo "POST /comments status=$http_code"
          cat /tmp/comment.json | head -c 2000; echo
          [ "$http_code" = "201" ] || { echo "ERROR: comment create returned $http_code"; exit 1; }

      - name: Assert plane-stub recorded the issue + label + comment + identity
        env:
          PLANE_STUB_URL: http://localhost:8081
          FORGE_ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_WAIT_SEC: 60
          ASSERT_COMMENT: "1"
          ASSERT_LABELS: "1"
          # Matches plane-stub's fixedMembers entry whose email is
          # pfbadmin@example.com (the forge admin user's email). The bridge's
          # v2 identity resolver should map the forge sender to this Plane
          # member by email.
          ASSERT_ASSIGNEE: "22222222-0000-0000-0000-000000000001"
        run: |
          set -euo pipefail
          chmod +x test/e2e-docker/assert.sh
          bash test/e2e-docker/assert.sh

      - name: Create a branch with a file change for the PR
        run: |
          set -euo pipefail
          # Get the main branch SHA so we can branch from it.
          main_sha=$(curl -fsS -H "Authorization: token $FORGE_TOKEN" \
            "$FORGE_URL/api/v1/repos/$FORGE_ORG/$FORGE_REPO/branches/main" | jq -r .commit.id)
          echo "main_sha=$main_sha"
          # Create the branch (Gitea/Forgejo branch-create API).
          curl -fsS -o /dev/null \
            -H "Authorization: token $FORGE_TOKEN" \
            -H 'Content-Type: application/json' \
            -X POST \
            -d "{\"new_branch_name\":\"e2e-pr\",\"old_branch_name\":\"main\"}" \
            "$FORGE_URL/api/v1/repos/$FORGE_ORG/$FORGE_REPO/branches"
          # Create a file on the new branch so the branch has a commit ahead of main.
          curl -fsS -o /dev/null \
            -H "Authorization: token $FORGE_TOKEN" \
            -H 'Content-Type: application/json' \
            -X POST \
            -d "{\"branch\":\"e2e-pr\",\"content\":\"$(printf 'e2e change' | base64)\",\"message\":\"e2e: file for PR\"}" \
            "$FORGE_URL/api/v1/repos/$FORGE_ORG/$FORGE_REPO/contents/pr.txt"

      - name: Open a PR with a [PFB-1] ref
        id: pr
        run: |
          set -euo pipefail
          http_code=$(curl -sS -o /tmp/pr.json -w '%{http_code}' \
            -H "Authorization: token $FORGE_TOKEN" \
            -H 'Content-Type: application/json' \
            -X POST \
            -d "{\"title\":\"[PFB-1] e2e PR\",\"body\":\"closes [PFB-1]\",\"head\":\"e2e-pr\",\"base\":\"main\"}" \
            "$FORGE_URL/api/v1/repos/$FORGE_ORG/$FORGE_REPO/pulls")
          echo "POST /pulls status=$http_code"
          cat /tmp/pr.json | head -c 2000; echo
          [ "$http_code" = "201" ] || { echo "ERROR: pr create returned $http_code"; exit 1; }
          echo "number=$(jq -r .number /tmp/pr.json)" >> "$GITHUB_OUTPUT"

      - name: Assert plane-stub recorded a state PATCH for the PR open
        env:
          PLANE_STUB_URL: http://localhost:8081
          # PFB In Progress UUID from plane-stub's fixedStates list.
          EXPECTED_STATE_UUID: 11111111-0000-0000-0000-000000000002
          PR_WAIT_SEC: 60
        run: |
          set -euo pipefail
          for i in $(seq 1 "$PR_WAIT_SEC"); do
            match=$(curl -fsS "$PLANE_STUB_URL/_/recorded" |
              jq -c --arg s "$EXPECTED_STATE_UUID" '
                .[] |
                select(.method == "PATCH") |
                select(.path | test("/api/v1/workspaces/[^/]+/projects/[^/]+/issues/[^/]+/?$")) |
                (.body | try fromjson) as $b |
                select($b.state == $s) |
                {path: .path, state: $b.state}
              ' | head -n1)
            if [ -n "$match" ]; then
              echo "matched PR state PATCH after ${i}s:"
              printf '%s\n' "$match" | jq .
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: no PATCH to In Progress state recorded within ${PR_WAIT_SEC}s"
          curl -fsS "$PLANE_STUB_URL/_/recorded" | jq '[.[] | select(.method=="PATCH")]'
          exit 1

      - name: Plane→forge — POST a synthetic plane work_item.created webhook
        env:
          PLANE_SECRET: ${{ env.PFB_PLANE_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          # Build a minimal plane webhook payload referencing the configured
          # link's plane_project_id (aaaaaaaa...). The bridge will resolve
          # the link, render the description with both markers, and POST a
          # new issue to the forge.
          body=$(cat <<'JSON'
          {
            "event": "issue",
            "action": "create",
            "workspace_id": "00000000-0000-0000-0000-000000000aaa",
            "webhook_id": "00000000-0000-0000-0000-000000000bbb",
            "data": {
              "id": "33333333-3333-3333-3333-333333333333",
              "name": "e2e: hello from plane",
              "description_html": "<p>Issue created on Plane that the bridge should mirror to forge.</p>",
              "state": "11111111-0000-0000-0000-000000000002",
              "project": "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa",
              "workspace": "00000000-0000-0000-0000-000000000aaa",
              "created_by": "44444444-4444-4444-4444-444444444444",
              "assignees": [],
              "labels": [],
              "sequence_id": 999
            }
          }
          JSON
          )
          sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$PLANE_SECRET" -hex | awk '{print $NF}')
          status=$(curl -sS -o /tmp/pwh.resp -w '%{http_code}' \
            -X POST http://127.0.0.1:8080/plane/webhook \
            -H "X-Plane-Signature: $sig" \
            -H "X-Plane-Event: issue" \
            -H "X-Plane-Delivery: plane-to-forge-${{ github.run_id }}" \
            -H 'Content-Type: application/json' \
            --data-binary "$body")
          echo "status=$status body=$(cat /tmp/pwh.resp)"
          [ "$status" = "202" ] || { echo "ERROR: expected 202, got $status"; exit 1; }

      - name: Assert forge now has an issue with the plane-ref marker
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            issues=$(curl -fsS \
              -H "Authorization: token $FORGE_TOKEN" \
              "$FORGE_URL/api/v1/repos/$FORGE_ORG/$FORGE_REPO/issues?state=all")
            match=$(printf '%s' "$issues" | jq -c '
              .[] |
              select(.body | test("<!-- pfb:plane-workitem=")) |
              {number, title, body}
            ' | head -n1)
            if [ -n "$match" ]; then
              echo "matched forge issue with plane-ref marker after ${i}s:"
              printf '%s\n' "$match" | jq .
              # Also check the loop-break marker is present.
              body=$(printf '%s' "$match" | jq -r .body)
              if ! printf '%s' "$body" | grep -q "<!-- pfb:src=plane,evt="; then
                echo "ERROR: forge issue body missing loop-break marker"
                echo "body=$body"
                exit 1
              fi
              echo "loop-break marker also present"
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: no forge issue carrying the plane-ref marker found within 30s"
          printf '%s' "$issues" | jq .
          exit 1

      - name: Capture diagnostics on failure
        if: failure()
        run: |
          echo "===== bridge container log ====="; docker logs bridge 2>&1 | tail -200 || true
          echo "===== plane-stub container log ====="; docker logs plane-stub 2>&1 | tail -200 || true
          echo "===== forge container log ====="; docker logs '${{ steps.forge.outputs.name }}' 2>&1 | tail -200 || true
          echo "===== recorded plane-stub calls ====="; curl -fsS http://localhost:8081/_/recorded | jq . || true
          echo "===== config.yaml ====="; cat config.yaml || true

      - name: Upload diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          docker logs bridge      > artifacts/bridge.log     2>&1 || true
          docker logs plane-stub  > artifacts/plane-stub.log 2>&1 || true
          docker logs '${{ steps.forge.outputs.name }}' > artifacts/forge.log 2>&1 || true
          curl -fsS http://localhost:8081/_/recorded > artifacts/recorded.json 2>/dev/null || true
          cp config.yaml artifacts/ || true

      - name: Upload diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-docker-${{ matrix.forge.name }}-logs
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          set +e
          docker rm -f bridge 2>/dev/null
          docker rm -f plane-stub 2>/dev/null

  # Publish on push to main (rolling `:latest`) and on v* tag pushes (semver
  # tags). Never on PRs. Retag the build-image artifact rather than rebuild —
  # the bytes we publish are the bytes e2e-docker just validated.
  publish:
    name: publish
    needs: [lint, build-image, e2e-docker]
    if: |
      github.event_name != 'pull_request' &&
      needs.e2e-docker.result == 'success' &&
      needs.lint.result == 'success'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Need full tag history so the "highest semver" step can compare
          # the pushed ref against every prior release tag.
          fetch-depth: 0

      # Guard floating `{{major}}` and `{{major}}.{{minor}}` tags against
      # backport pushes. We only emit those when the pushed tag is the
      # highest semver in the repo; backport publishes still get the exact
      # `:0.1.5` and `:<sha>` tags but leave the floating tags pinned.
      - name: Is this the highest semver tag?
        id: highest
        run: |
          set -euo pipefail
          latest=$(git tag -l 'v*' | sort -V | tail -n1)
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" = "$latest" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.highest.outputs.yes == 'true' }}
            type=semver,pattern={{major}},enable=${{ steps.highest.outputs.yes == 'true' }}
            type=sha

      - name: Retag build-image with release tags
        env:
          SRC: ${{ needs.build-image.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            args+=(--tag "$tag")
          done <<< "$TAGS"
          echo "retagging $SRC →"
          printf '  %s\n' "${args[@]}"
          docker buildx imagetools create "${args[@]}" "$SRC"
